<style>
/* Idée de mise en page : un carnet de comptes de poche. Le bandeau des soldes est la page
   « reliée » (une colonne par devise, séparées par un filet doré) ; tout le reste est calme. */
:root{
  --bg:#EDF1EE; --surface:#FBFCFA; --ink:#12211F; --ink-2:#4A5A57; --muted:#6E7C79; --line:#D5DDD9;
  --accent:#0E5F57; --accent-ink:#FFFFFF; --hero:#12302D; --hero-ink:#F1F5F0; --hero-muted:#A9BDB8; --rule:#E3A72F;
  --s1:#2a78d6; --s2:#eb6834; --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --track:#E2E8E4; --other:#9AA6A2;
  --shadow:0 1px 2px rgba(16,32,48,.05),0 6px 20px rgba(16,32,48,.07);
  --glass-bg:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.74); --glass-brd:rgba(255,255,255,.75); --glass-hi:rgba(255,255,255,.95); --glass-sh:0 8px 28px rgba(20,40,80,.12);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-mode="light"]){
    --bg:#0E1514; --surface:#172120; --ink:#EEF2EE; --ink-2:#B8C4C0; --muted:#8C9995; --line:#2A3735;
    --accent:#56BDB1; --accent-ink:#06211E; --hero:#1C2D2A; --hero-ink:#F1F5F0; --hero-muted:#9DB1AC;
    --s1:#3987e5; --s2:#d95926; --crit:#e66767; --track:#26312F; --other:#66726F; --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.22); --glass-bg:rgba(30,36,46,.48); --glass-strong:rgba(26,31,40,.76); --glass-brd:rgba(255,255,255,.13); --glass-hi:rgba(255,255,255,.16); --glass-sh:0 8px 28px rgba(0,0,0,.38); color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-mode="light"]),:root[data-mode="dark"]{
  --bg:#0E1514; --surface:#172120; --ink:#EEF2EE; --ink-2:#B8C4C0; --muted:#8C9995; --line:#2A3735;
  --accent:#56BDB1; --accent-ink:#06211E; --hero:#1C2D2A; --hero-ink:#F1F5F0; --hero-muted:#9DB1AC;
  --s1:#3987e5; --s2:#d95926; --crit:#e66767; --track:#26312F; --other:#66726F; --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.22); --glass-bg:rgba(30,36,46,.48); --glass-strong:rgba(26,31,40,.76); --glass-brd:rgba(255,255,255,.13); --glass-hi:rgba(255,255,255,.16); --glass-sh:0 8px 28px rgba(0,0,0,.38); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html.nozoom{touch-action:pan-x pan-y}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
/* pas de sélection de texte sur les menus, titres et boutons */
button,a,label,h1,h2,h3,legend,nav,.top,.seg,.filters,.pill-btn,.btn,.chip,.tile small,.period,.switch,.back,.menu,.zbar,.state,.toast,.sheet h2{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
*{-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.sr{position:absolute !important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative}
.skip{position:absolute;inset-inline-start:12px;top:-80px;z-index:30;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:10px;font-weight:600}
.skip:focus{top:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 10px}
.top h1{font-family:var(--display);font-weight:700;font-size:24px;margin:0;letter-spacing:-.01em}
.top h1:focus:not(:focus-visible){outline:none}
.top small{color:var(--muted);font-size:12px}
.top-r{display:flex;align-items:center;gap:8px;flex:none}
.gear{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink-2);background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);box-shadow:var(--shadow)}
.gear svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.gear[aria-current]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand .logo{width:30px;height:30px;flex:none}
.chip.acc{font-size:14px;background:color-mix(in srgb,var(--ac) 18%,var(--surface));color:color-mix(in srgb,var(--ac) 72%,var(--ink));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 28%,transparent)}.chip.acc i{display:none}
main{flex:1;overflow-y:auto;padding:4px 16px 108px;display:flex;flex-direction:column;gap:16px}
main > *{flex-shrink:0}
nav.tabs{display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 2px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(16,32,48,.06)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:58px;font-size:12px;font-weight:500;color:var(--muted);text-decoration:none;letter-spacing:-.01em}
nav.tabs .ti{display:grid;place-items:center;width:52px;height:30px;border-radius:15px;transition:background .2s}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current]{color:var(--accent);font-weight:700}
nav.tabs a[aria-current] .ti{background:color-mix(in srgb,var(--accent) 16%,transparent)}
@media (max-width:370px){nav.tabs a{font-size:11px}nav.tabs .ti{width:44px}}
.fab{position:absolute;inset-inline-end:16px;bottom:calc(92px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 45%,transparent);display:grid;place-items:center}
.fab:active{transform:scale(.96)}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:14px;text-decoration:none;align-self:flex-start;padding:4px 0}

/* bandeau des soldes */
.ledger{background:linear-gradient(150deg,color-mix(in srgb,var(--hero) 76%,var(--accent)),var(--hero) 72%);color:var(--hero-ink);border-radius:22px;box-shadow:0 10px 26px color-mix(in srgb,var(--hero) 32%,transparent);display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.ledger.one{grid-template-columns:1fr}
.ledger > div{padding:16px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.ledger > div:nth-child(even){border-inline-start:2px solid var(--rule)}
.ledger > div:nth-child(n+3){border-top:1px solid rgba(255,255,255,.14)}
.ledger .lab{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--hero-muted);font-weight:600}
.ledger .big{font-family:var(--display);font-weight:700;font-size:clamp(20px,6.4vw,28px);letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ledger .big span{font-size:.55em;font-weight:500;color:var(--hero-muted)}
.ledger .flow{font-size:12px;color:var(--hero-muted);display:flex;flex-direction:column;margin-top:6px}
.ledger .flow b{color:var(--hero-ink);font-weight:500}

.card{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 2px -6px}
.sec-h h2,h2.sec-h{font-family:var(--display);font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
h2.sec-h{margin:0 2px -6px;display:block}
.link{color:var(--accent);font-weight:600;font-size:13px;text-decoration:none}
ul.rows,ul.pie-leg,ul.plain{list-style:none;margin:0;padding:0}
ul.rows{display:flex;flex-direction:column}
ul.card.rows{padding:2px 16px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:start}
.rows > li:last-child > .row,.rows > li.row:last-child{border-bottom:0}
.row .t{min-width:0}
.row .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{color:var(--muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{width:40px;height:40px;border-radius:13px;background:var(--track);color:var(--ink-2);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;overflow:hidden;flex:none}
.chip.emo{background:var(--track)}
/* icônes : dessin en noir et blanc sur une pastille teintée de la couleur du thème */
.chip.emo{background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 22%,var(--surface)),color-mix(in srgb,var(--accent) 8%,var(--surface)));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 20%,transparent);transition:transform .15s}
.chip.emo .e,.icons label > span:first-of-type{filter:grayscale(1) contrast(1.08)}
.chip.emo .e{display:block;line-height:1}
:root[data-mode="dark"] .chip.emo .e,:root[data-theme="dark"]:not([data-mode="light"]) .chip.emo .e{filter:grayscale(1) brightness(1.2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-mode="light"]) .chip.emo .e{filter:grayscale(1) brightness(1.2)}}
.row:active .chip,.menu a:active .chip,.rank:active .chip{transform:scale(.9)}
/* rubriques : filet de couleur devant les titres de section */
.sec-h h2::before,h2.sec-h::before{content:"";display:inline-block;width:4px;height:15px;border-radius:2px;background:linear-gradient(var(--accent),var(--rule));margin-inline-end:9px;vertical-align:-2px}
h3.day{color:color-mix(in srgb,var(--accent) 60%,var(--muted))}
.menu a b{font-weight:600}
/* entrée douce quand on change d'écran */
@media (prefers-reduced-motion:no-preference){
  #view.enter > *{animation:rise .34s ease-out both}
  #view.enter > *:nth-child(2){animation-delay:.04s}#view.enter > *:nth-child(3){animation-delay:.08s}#view.enter > *:nth-child(4){animation-delay:.12s}#view.enter > *:nth-child(n+5){animation-delay:.16s}
  @keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
}
.chip.emo{font-size:19px;font-family:system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.chip img{width:100%;height:100%;object-fit:cover}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.rev{color:var(--accent)} .amt.vir{color:var(--muted)} .amt.dep{color:color-mix(in srgb,var(--crit) 42%,var(--ink))}
.rec-mark{color:var(--muted);font-weight:400;margin-inline-start:4px}
h3.day{font-size:11px;color:var(--muted);font-weight:700;padding:14px 0 4px;margin:0;font-family:var(--body);text-transform:uppercase;letter-spacing:.07em}
h3.day span{display:inline-block}h3.day span::first-letter{text-transform:uppercase}
.bar-line{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.switch{display:flex;align-items:center;gap:4px}
.switch button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.switch b{min-width:118px;text-align:center;font-family:var(--display);font-size:15px;text-transform:capitalize}
.seg{display:inline-flex;background:var(--track);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-2);min-height:34px}
.seg label{cursor:pointer;position:relative}
.seg label span{display:block;padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg [aria-pressed="true"],.seg input:checked + span{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.seg input,.swatches input,.icons input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.seg input:focus-visible + span,.swatches input:focus-visible + span,.icons input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.seg.wide{display:flex}.seg.wide > *{flex:1;text-align:center}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.pill-btn{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--ink-2);text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:34px}
.pill-btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
input[type=text],input[type=search],input[type=date],input[type=number],select{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface);min-height:44px}
input[type=file]{font-size:13px;max-width:100%}
input[type=text]:focus,input[type=search]:focus,input[type=date]:focus,input[type=number]:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
input[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--crit);box-shadow:0 0 0 1px var(--crit)}
.empty{color:var(--muted);text-align:center;padding:22px 8px;font-size:14px;list-style:none;margin:0}
.banner{background:var(--surface);border:1px dashed var(--rule);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--ink-2)}
.banner b{color:var(--ink)}
.btn{padding:11px 16px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:600;min-height:44px;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--crit);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:13px;border-radius:10px}
.btn{box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 26%,transparent);transition:transform .1s}
.btn.ghost,.btn.danger{box-shadow:none}
.btn:active,.pill-btn:active,.fab:active{transform:scale(.97)}
.hint{display:block;color:var(--muted);font-size:12px;margin-top:8px}.hint b{color:var(--ink-2)}
p.hint{margin:0}

/* listes de réglages */
.menu a{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.menu li:last-child a{border-bottom:0}
.menu a b{font-weight:500;display:block}.menu a small{color:var(--muted);font-size:12px}
.menu .chev,.chev{color:var(--muted);font-weight:400}

/* budgets, prêts */
.budget{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;width:100%;text-align:start}
.rows > li:last-child > .budget{border-bottom:0}
.budget .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.budget .h b{font-weight:600}
.track{height:8px;border-radius:4px;background:var(--track);overflow:hidden;display:block}
.track i{display:block;height:100%;border-radius:4px;background:var(--good)}
.track i.warn{background:var(--warn)} .track i.crit{background:var(--crit)}
.budget small{color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:8px}
.state{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.state::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.state.warn::before{background:var(--warn)} .state.crit::before{background:var(--crit)} .state.off::before{background:var(--muted)}
.alert{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}
.rows > li.alert:last-child{border-bottom:0}
.pend{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.rows > li.pend:last-child{border-bottom:0}
.pend .top-l{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.pend .t b{display:block;font-weight:500}.pend .t small{color:var(--muted);font-size:12px}
.pend-act{display:flex;gap:8px;justify-content:flex-end}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiles.two{grid-template-columns:1fr 1fr}
.tile{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:16px;padding:12px;min-width:0;box-shadow:var(--shadow)}
.tile small{color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.tile b{display:block;font-family:var(--display);font-size:clamp(13px,4.1vw,17px);font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.tiles.two .tile b{white-space:normal;font-size:15px}
.tile b span{display:block;font-family:var(--body);font-size:11px;font-weight:500;color:var(--muted)}
.rank{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;padding:8px 0;font-size:14px;width:100%;text-align:start;align-items:center}
.rank .chip{width:28px;height:28px;font-size:15px;border-radius:8px;grid-row:span 2}
.rank .track{grid-column:2 / -1;height:8px}
.rank .track i{background:var(--cc,var(--s1))}
.rank small{color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin:2px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart g.m{cursor:pointer}
.zoomable{overflow:hidden;touch-action:none;border-radius:8px;position:relative}
.zoomable.zoomed{cursor:grab;outline:1px dashed var(--line)}
.zin{transform-origin:0 0}
.zbar{display:flex;justify-content:flex-end;gap:4px;margin-top:4px}
.zbar button{min-width:34px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-2);padding:0 8px}
table.mini{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
table.mini th{color:var(--muted);font-weight:600;text-align:end;padding:5px 0;border-bottom:1px solid var(--line)}
table.mini td{text-align:end;padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.mini th:first-child,table.mini td:first-child{text-align:start}
table.mini th[scope=row]{font-weight:500;color:var(--ink)}
table.mini tr:last-child td,table.mini tr:last-child th{border-bottom:0}
.linkbtn{font:inherit;color:inherit;text-transform:capitalize;text-decoration:underline dotted;text-underline-offset:3px;padding:4px 0}
.cap{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.cap b{font-family:var(--display);font-size:17px;color:var(--ink)}
.pie{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pie .zoomable{width:160px;flex:none;margin:0 auto}
.pie svg{width:160px;height:160px;display:block}
.pie .pc1{font-family:var(--display);font-weight:700;font-size:19px;fill:var(--ink)}
.pie .pc2{font-size:10px;fill:var(--muted);font-family:var(--body)}
.pie-leg{flex:1;min-width:180px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.pie-leg button,.pie-leg li > div{width:100%;text-align:start;display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:3px 0;min-height:32px}
.pie-leg i{width:10px;height:10px;border-radius:3px}
.pie-leg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pie-leg small{color:var(--muted)}.pie-leg b{font-weight:600;min-width:64px;text-align:end}
.period{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:8px;padding:7px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:start;min-height:44px;flex:1 1 150px;min-width:0}
.period b{font-family:var(--display);font-size:14px}.period small{color:var(--muted);font-size:12px}
.period > span{color:var(--muted);grid-column:2;grid-row:1 / span 2}
.period b,.period small{grid-column:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv{display:flex;flex-direction:column;gap:8px;margin:0;font-size:14px}
.kv div{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;font-variant-numeric:tabular-nums;font-weight:500;text-align:end}
.kv .strong{border-top:1px solid var(--line);padding-top:8px} .kv .strong dt{color:var(--ink);font-weight:600} .kv .strong dd{font-weight:700;font-family:var(--display);font-size:16px}

/* catégories */
.cats ul.sub{list-style:none;margin:0;padding:0;padding-inline-start:22px;border-inline-start:2px solid var(--line);margin-inline-start:17px}
.cats ul.sub .row{grid-template-columns:auto 1fr auto}
.cats ul.sub .chip{width:30px;height:30px;font-size:16px;border-radius:9px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches label{position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--ink-2)}
.swatches .dot{width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);display:block}
.swatches input:checked + .dot{box-shadow:0 0 0 2px var(--ink)}
.icons .ig{grid-column:1 / -1;margin:6px 0 0;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.icons .ig:first-child{margin-top:0}.icons [hidden]{display:none}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;max-height:250px;overflow-y:auto;padding:2px}
.icons label{position:relative;cursor:pointer}
.icons label > span:first-of-type{display:grid;place-items:center;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:21px;font-family:system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;overflow:hidden}
.icons label > span img{width:100%;height:100%;object-fit:cover}
.icons input:checked + span{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.filebtn{position:relative;display:flex}.filebtn .btn{flex:1}
.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.filebtn input:focus-visible + .btn{outline:2px solid var(--accent);outline-offset:2px}

/* formulaires */
.sheet-wrap{position:fixed;inset:0;background:rgba(6,20,18,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet-wrap[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:12px}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 2px;flex:none}
.sheet h2{font-family:var(--display);font-size:19px;margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet h2:focus:not(:focus-visible){outline:none}
.sheet h2 button{font-size:22px;color:var(--muted);width:40px;height:40px;flex:none}
.sheet form{display:flex;flex-direction:column;gap:12px}
fieldset{border:0;margin:0;padding:0;min-width:0}
fieldset > legend,.f > span,.f > label{font-size:12px;font-weight:600;color:var(--ink-2);padding:0;margin-bottom:5px}
.f{display:flex;flex-direction:column;gap:5px}
.f.inline{flex-direction:row;align-items:center;gap:10px;margin-top:8px}.f.inline > span{white-space:nowrap;margin:0}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amount-in{font-family:var(--display);font-size:26px !important;font-weight:700;font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:center;font-size:14px;min-height:40px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.boxed{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.err{color:var(--crit);font-size:13px;font-weight:500}
.err:empty{display:none}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1}
.imp-prev{font-size:13px;display:flex;flex-direction:column;gap:6px}
.imp-prev li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(164px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:500;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast[hidden]{display:none}
.toast:not([hidden]){display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast button{background:rgba(255,255,255,.18);color:inherit;font-weight:700;padding:7px 12px;border-radius:9px;flex:none}
/* balayer pour supprimer */
li.sw{position:relative;overflow:hidden;border-radius:12px}
.filters.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}.filters.scroll::-webkit-scrollbar{display:none}.filters.scroll > *{flex:none}
.sw-bg{position:absolute;inset:3px 0;border-radius:12px;background:var(--crit);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-inline-end:16px;font-weight:700;font-size:14px;opacity:0;transition:background .15s}
li.sw.swiping .sw-bg{opacity:1}
li.sw.armed .sw-bg{background:color-mix(in srgb,var(--crit) 80%,#000)}
li.sw > .row{position:relative;background:var(--surface);touch-action:pan-y}
li.sw.swiping > .row{border-radius:12px}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(28px)}to{transform:none}}
}
@media (max-width:360px){.f2{grid-template-columns:1fr}}
/* pas de cadre autour des titres qui reçoivent le focus (lecteurs d'écran) */
[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none}

/* camembert */
.donut{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 4px}
.donut .zoomable{width:min(250px,80vw)}
.donut svg{width:100%;height:auto;display:block}
.donut .ring{transform-origin:110px 110px}
@media (prefers-reduced-motion:no-preference){
  .donut .ring{animation:ringin .9s cubic-bezier(.2,.8,.2,1) both}@keyframes ringin{from{transform:rotate(-40deg) scale(.9)}}
  .donut .arc{animation:draw .75s cubic-bezier(.3,.7,.2,1) both;animation-delay:calc(var(--i,0) * 85ms + .08s)}@keyframes draw{from{stroke-dasharray:0 600}}
  .donut text{animation:fadein .5s .35s ease-out both}
  svg.chart .bar{transform-box:fill-box;transform-origin:50% 100%;animation:barup .65s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}@keyframes barup{from{transform:scaleY(0)}}
  svg.chart .line{stroke-dasharray:1;animation:linedraw 1.1s cubic-bezier(.4,0,.2,1) both}@keyframes linedraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  svg.chart .area{animation:fadein .8s .45s ease-out both}
  #bal-dot{transform-box:fill-box;transform-origin:center;animation:pop .45s 1s cubic-bezier(.3,1.6,.5,1) both}@keyframes pop{from{transform:scale(0)}}
  @keyframes fadein{from{opacity:0}}
  .track i{animation:grow .75s cubic-bezier(.2,.8,.2,1) both}@keyframes grow{from{width:0}}
  .rows > li:nth-child(2) .track i{animation-delay:.05s}.rows > li:nth-child(3) .track i{animation-delay:.1s}.rows > li:nth-child(4) .track i{animation-delay:.15s}.rows > li:nth-child(5) .track i{animation-delay:.2s}.rows > li:nth-child(6) .track i{animation-delay:.25s}.rows > li:nth-child(n+7) .track i{animation-delay:.3s}
  .tiles .tile{animation:tilein .45s cubic-bezier(.2,.8,.2,1) both}.tiles .tile:nth-child(2){animation-delay:.06s}.tiles .tile:nth-child(3){animation-delay:.12s}@keyframes tilein{from{opacity:0;transform:translateY(8px) scale(.97)}}
}
.donut .c1{font-family:var(--display);font-weight:700;font-size:26px;fill:var(--ink)}
.donut .c2{font-size:11px;fill:var(--muted);font-family:var(--body)}
.donut .arc{cursor:pointer;transition:opacity .15s}
.donut .arc:hover{opacity:.85}

/* tri des catégories */
.cats .cat-line{display:flex;align-items:center;gap:4px}
.cats .cat-line .row{flex:1;min-width:0;border-bottom:1px solid var(--line)}
.cats > li:last-child > .cat-line:only-child .row,.cats > li:last-child ul.sub > li:last-child .row{border-bottom:0}
.drag{width:42px;height:42px;flex:none;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab;border-radius:12px}
.drag svg{width:20px;height:20px;fill:currentColor}
.drag:active{cursor:grabbing;background:var(--track)}
.cats li.dragging{position:relative;z-index:6;background:var(--surface);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.2)}
.cats li.dragging .row{border-bottom-color:transparent}

/* ===== style « verre liquide » ===== */
:root[data-style="glass"] body{background:
  radial-gradient(55% 40% at 8% 6%,color-mix(in srgb,var(--accent) 52%,transparent),transparent 70%),
  radial-gradient(45% 35% at 96% 24%,color-mix(in srgb,var(--rule) 44%,transparent),transparent 70%),
  radial-gradient(55% 45% at 18% 92%,color-mix(in srgb,#e87ba4 32%,transparent),transparent 70%),
  radial-gradient(50% 40% at 92% 86%,color-mix(in srgb,#6EA8EC 40%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
:root[data-style="glass"] #app{background:transparent}
:root[data-style="glass"] :is(.card,.tile,.gear,.banner,.period,.switch button,.pill-btn,input[type=text],input[type=search],input[type=date],input[type=number],select,.btn.ghost,.btn.danger,.zbar button,.seg){background:var(--glass-bg);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);border:1px solid var(--glass-brd);box-shadow:inset 0 1px 0 var(--glass-hi),var(--glass-sh)}
:root[data-style="glass"] .seg{box-shadow:inset 0 1px 0 var(--glass-hi)}
:root[data-style="glass"] .seg [aria-pressed="true"],:root[data-style="glass"] .seg input:checked + span{background:var(--glass-strong);box-shadow:inset 0 1px 0 var(--glass-hi),0 2px 8px rgba(0,0,0,.1)}
:root[data-style="glass"] .pill-btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
:root[data-style="glass"] .gear[aria-current]{background:var(--accent);color:var(--accent-ink)}
:root[data-style="glass"] :is(input,select):focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
:root[data-style="glass"] nav.tabs{margin:0 10px calc(8px + env(safe-area-inset-bottom));padding:6px 4px;border-radius:30px;background:var(--glass-strong);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--glass-brd);box-shadow:inset 0 1px 0 var(--glass-hi),0 10px 30px rgba(0,0,0,.16)}
:root[data-style="glass"] .fab{bottom:calc(104px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--accent) 80%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 26px color-mix(in srgb,var(--accent) 40%,transparent)}
:root[data-style="glass"] .btn:not(.ghost):not(.danger){background:color-mix(in srgb,var(--accent) 86%,transparent);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px color-mix(in srgb,var(--accent) 30%,transparent)}
:root[data-style="glass"] .ledger{background:linear-gradient(150deg,color-mix(in srgb,var(--hero) 72%,transparent),color-mix(in srgb,var(--accent) 58%,transparent));-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 12px 30px rgba(0,0,0,.18)}
:root[data-style="glass"] .sheet{background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border-top:1px solid var(--glass-brd)}
:root[data-style="glass"] .sheet-wrap{background:rgba(6,20,30,.22);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
:root[data-style="glass"] .toast{background:rgba(18,22,28,.72);color:#fff;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
:root[data-style="glass"] li.sw > .row{background:transparent}
:root[data-style="glass"] li.sw.swiping > .row,:root[data-style="glass"] .cats li.dragging{background:var(--glass-strong)}
:root[data-style="glass"] .chip.emo,:root[data-style="glass"] .chip{box-shadow:inset 0 1px 0 var(--glass-hi)}
@media (prefers-reduced-transparency:reduce){:root[data-style="glass"]{--glass-bg:var(--surface);--glass-strong:var(--surface)}}

.amtrow{display:flex;gap:8px;align-items:stretch}.amtrow input{flex:1;min-width:0}
.signb{width:48px;flex:none;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;color:var(--accent)}
.part .pnote{grid-column:1 / -1}
/* davantage de couleurs */
#app{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 11%,var(--bg)),var(--bg) 300px)}
nav.tabs a:nth-child(1){--tc:var(--accent)}nav.tabs a:nth-child(2){--tc:#2a78d6}nav.tabs a:nth-child(3){--tc:#6250d6}nav.tabs a:nth-child(4){--tc:#eb6834}nav.tabs a:nth-child(5){--tc:#1baf7a}nav.tabs a:nth-child(6){--tc:#d9548a}
nav.tabs a .ti{color:color-mix(in srgb,var(--tc) 55%,var(--muted))}
nav.tabs a[aria-current]{color:color-mix(in srgb,var(--tc) 78%,var(--ink))}
nav.tabs a[aria-current] .ti{background:color-mix(in srgb,var(--tc) 20%,transparent);color:color-mix(in srgb,var(--tc) 85%,var(--ink))}
.chip.emo[style*="--cc"]{background:linear-gradient(145deg,color-mix(in srgb,var(--cc) 28%,var(--surface)),color-mix(in srgb,var(--cc) 11%,var(--surface)));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cc) 30%,transparent)}

  async get(k) { try { const db = await this.open(); return await new Promise(res => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); } catch (e) { return undefined; } },
  async set(k, v) { try { const db = await this.open(); return await new Promise(res => { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); }); } catch (e) { return false; } },

/* une seule écriture à la fois par document */
const pending = new Set(), busy = new Set();
function push(id) { if (!col || demo) return; pending.add(id); pump(id); }
async function pump(id) {
  if (busy.has(id)) return; busy.add(id);
  while (pending.has(id)) {
    pending.delete(id);
    try { await col.doc(id).set(clone(getDoc(id))); setSync("cloud"); }
    catch (e) {
      if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 1500 + Math.random() * 1500)); try { await col.doc(id).set(clone(getDoc(id))); continue; } catch (e2) {} }
      setSync(e && e.code === "invalid_argument" ? "toolarge" : "error"); break;
    }
  }
  busy.delete(id);
}
function touch(...ids) { if (demo) return; ids.forEach(id => { const d = getDoc(id); if (d) d.updatedAt = Date.now(); }); localSave(); ids.forEach(push); }
function setSync(s) {
  syncState = s;
  $("#sync").textContent = demo ? L("Exemple") : s === "cloud" ? L("Enregistré") : s === "error" || s === "toolarge" ? L("Non synchronisé") : s === "loading" ? L("Chargement…") : L("Sur cet appareil");
}
async function initRemote() {
  try {
    if (!window.claude || !window.claude.use) return;
    setSync("loading");
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const id = user ? await user.id() : null;
    if (!db || !id) return;
    const c = db.collection("data/users/" + id);
    const snap = await Promise.race([c.limit(1000).get(), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 10000))]);
    const remote = {}; snap.docs.forEach(d => { if (d.exists) remote[d.id] = clone(d.data()); });
    if (demo && remote.meta) { S = {meta: null, months: {}}; demo = false; }
    if (!demo) {
      Object.keys(remote).forEach(k => { const l = getDoc(k); if (!l || (remote[k].updatedAt || 0) > (l.updatedAt || 0)) setDoc(k, remote[k]); });
      migrate(S.meta); col = c; localSave();
      docIds().forEach(k => { if (!remote[k] || (remote[k].updatedAt || 0) < (getDoc(k).updatedAt || 0)) push(k); });
    } else col = c;
    syncState = "cloud";
  } catch (e) { syncState = col ? "cloud" : "local"; }
  finally { loading = false; if (syncState === "loading") syncState = "local"; setSync(syncState); runAuto(true); render(); }
}

const FREQS = [["d1", L("Chaque jour")], ["w1", L("Chaque semaine")], ["w2", L("Toutes les deux semaines")], ["m1", L("Chaque mois")], ["m2", L("Tous les deux mois")], ["m3", L("Chaque trimestre")], ["m6", L("Chaque semestre")], ["y1", L("Chaque année")]];

function accSpark(a, bal) {
  const t = today(), from = ymd(new Date(Date.now() - 29 * 864e5)), per = {};
  for (const x of allTx()) { if (x.date < from) continue; let dl = 0; if (x.acc === a.id) dl += isIn(x) ? x.amt : -x.amt; if (x.t === "vir" && x.to === a.id) dl += (x.amtTo ?? x.amt); if (dl) per[x.date] = (per[x.date] || 0) + dl; }
  let v = bal; Object.keys(per).forEach(d => { if (d > t) v -= per[d]; });
  const now = v, vals = []; let d = new Date();
  for (let i = 0; i < 30; i++) { vals.unshift(v); v -= per[ymd(d)] || 0; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1); }
  const lo = Math.min(...vals), hi = Math.max(...vals), sp = hi - lo || 1;
  const pts = vals.map((y, i) => (i / 29 * 100).toFixed(1) + "," + (26 - (y - lo) / sp * 22).toFixed(1)).join(" ");
  return {now, diff: now - vals[0], svg: `<svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,30 ${pts} 100,30" fill="var(--ac)" opacity=".14"/><polyline points="${pts}" fill="none" stroke="var(--ac)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`};
}

/* ================= effet « génie » (comme la réduction d'une fenêtre sur Mac) ================= */
function genie(done) {
  const sh = $("#sheet"), wrap = $("#wrap"), tgt = document.querySelector('nav.tabs a[href="#operations"] .ti');
  if (!sh.animate || !tgt || matchMedia("(prefers-reduced-motion: reduce)").matches) return done();
  const r = sh.getBoundingClientRect(), t = tgt.getBoundingClientRect();
  const tx = Math.max(4, Math.min(96, (t.left + t.width / 2 - r.left) / r.width * 100)), dy = (t.top + t.height / 2) - r.bottom;
  const P = (a, b, c, d) => `polygon(${a}% 0%, ${b}% 0%, ${c}% 100%, ${d}% 100%)`;
  sh.style.pointerEvents = "none"; sh.style.transformOrigin = `${tx}% 100%`;
  const an = sh.animate([
    {clipPath: P(0, 100, 100, 0), transform: "translateY(0) scale(1, 1)", opacity: 1, offset: 0},
    {clipPath: P(0, 100, tx + 14, tx - 14), transform: "translateY(0) scale(1, .94)", opacity: 1, offset: .32},
    {clipPath: P(tx - 22, tx + 22, tx + 5, tx - 5), transform: `translateY(${dy * .4}px) scale(1, .55)`, opacity: .95, offset: .68},
    {clipPath: P(tx - 2, tx + 2, tx + 1, tx - 1), transform: `translateY(${dy}px) scale(1, .03)`, opacity: .2, offset: 1}
  ], {duration: 620, easing: "cubic-bezier(.5,0,.75,.45)", fill: "forwards"});
  const fade = wrap.animate([{backgroundColor: getComputedStyle(wrap).backgroundColor}, {backgroundColor: "rgba(0,0,0,0)"}], {duration: 620, easing: "ease-in", fill: "forwards"});
  an.onfinish = () => {
    done(); an.cancel(); fade.cancel(); sh.style.pointerEvents = ""; sh.style.transformOrigin = "";
    tgt.animate([{transform: "scale(1)"}, {transform: "scale(1.28)"}, {transform: "scale(.94)"}, {transform: "scale(1)"}], {duration: 420, easing: "ease-out"});
  };
}

async function offerFile(filename, data, okMsg) {
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (dl) { await dl.save({filename, data}); toast(okMsg); return true; }
  } catch (e) { if (e && e.code === "declined") return false; }
  try {
    const url = URL.createObjectURL(new Blob([data], {type: filename.endsWith(".json") ? "application/json" : "text/csv;charset=utf-8"}));
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast(okMsg); return true;
  } catch (e) {}
  try { await navigator.clipboard.writeText(data); toast(L("Téléchargement indisponible ici : le contenu est copié dans le presse-papiers.")); return true; }
  catch (e) { toast(L("L'enregistrement de fichier n'est pas disponible dans cette vue.")); return false; }
}
