# À chaque envoi sur GitHub : les tests sont lancés. Le site n'est mis en ligne QUE s'ils réussissent.
# Pour l'activer : Settings › Pages › Build and deployment › Source : « GitHub Actions ».
name: Vérifier et publier

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: test-results/
          retention-days: 14

  publier:
    name: Mise en ligne
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.essai1.outputs.page_url || steps.essai2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer uniquement les fichiers de l'appli
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest confidentialite.html icon.svg *.png css js fonts _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: site-${{ github.run_attempt }}
      # GitHub met parfois quelques secondes à « voir » le fichier envoyé : on réessaie une fois.
      - id: essai1
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: site-${{ github.run_attempt }}
      - if: steps.essai1.outcome == 'failure'
        run: sleep 30
      - id: essai2
        if: steps.essai1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: site-${{ github.run_attempt }}
